
services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .

    environment:
      DATABASE_URL: postgresql+psycopg://estoque:estoque@db:5432/estoque

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
